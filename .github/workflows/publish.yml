# npm Publishing (Optional Template Scaffolding — DISABLED for the template)
#
# IMPORTANT: forge-workhorse-tuvan is a TEMPLATE, not a published package. You do
# not install it from npm — you CDRL it (clone → degit → refit → launch) and then
# publish YOUR OWN refit tool. To enforce that, the package ships `"private": true`
# and this workflow has a guard that refuses to publish while the package is still
# private or still uses the template name (see the "Publish to npm" step). So as
# shipped, this workflow CANNOT publish the template — it exists only as reference
# scaffolding and a dry-run validator for CDRL consumers.
#
# OIDC trusted publishing to npm — no NPM_TOKEN secret needed.
# Triggered manually via workflow_dispatch.
#
# ENABLE (for CDRL users publishing THEIR refit app):
#   1. In your refit: rename the package (`name`) and remove `"private": true`
#   2. Create a GitHub Environment named "publish-npm"
#   3. Link your npm package to GitHub via npm's "Trusted Publishing" settings
#   4. Optionally add tag-based deployment protection rules
name: Publish to npm
"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate without publishing)"
        required: false
        default: false
        type: boolean
permissions:
  id-token: write
  contents: read
env:
  BUN_VERSION: "1.2.22"
  # Single pin for the goneat toolchain: feeds both the cache key below and
  # `make bootstrap` (Make's ?= respects this env value over the Makefile default).
  GONEAT_VERSION: "v0.5.13"
jobs:
  publish:
    name: Publish to npm (OIDC)
    runs-on: ubuntu-latest
    environment: publish-npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          # Exact-match only — no broad restore-keys. A version-bump cache miss
          # must NOT fall back to an older goneat (bootstrap is version-aware and
          # would reinstall, but exact-only keeps the cache honest per-version).
          key: ${{ runner.os }}-toolchain-goneat-${{ env.GONEAT_VERSION }}
      - name: Bootstrap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make bootstrap
      - name: Build
        run: make build
      - name: Quality gate
        run: make check-all
      - name: Publish to npm
        run: |
          # Install npm with OIDC support (hosted runner npm may be outdated)
          echo "Installing npm@latest locally for OIDC support..."
          npm install --no-save npm@latest
          LOCAL_NPM="node ./node_modules/npm/bin/npm-cli.js"
          echo "npm version: $($LOCAL_NPM --version)"

          # Force OIDC mode — prevent any token auth from interfering
          unset NODE_AUTH_TOKEN NPM_TOKEN
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-oidc"
          printf '%s\n' 'registry=https://registry.npmjs.org/' 'always-auth=false' > "$NPM_CONFIG_USERCONFIG"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run mode — validating package..."
            npm pack --dry-run
            echo "Dry run complete (no publish)"
          else
            # Template guard — forge-workhorse-tuvan is a template, not a published
            # package (ships "private": true + the template name). A CDRL consumer
            # who wants npm publishing renames the package and removes "private" in
            # their refit; until then, refuse so the template never reaches a registry.
            PKG_NAME=$(node -p "require('./package.json').name")
            IS_PRIVATE=$(node -p "require('./package.json').private === true")
            if [ "$IS_PRIVATE" = "true" ] || [ "$PKG_NAME" = "@fulmenhq/forge-workhorse-tuvan" ]; then
              echo "::notice::Refusing to publish the forge-workhorse-tuvan TEMPLATE to npm."
              echo "A template is meant to be CDRL'd (clone → degit → refit → launch), not published."
              echo "To publish YOUR refit app: set a new package name and remove \"private\": true, then re-run."
              exit 0
            fi
            echo "Publishing to npm via OIDC..."
            $LOCAL_NPM publish --access public --provenance
            echo "Published successfully"
          fi
